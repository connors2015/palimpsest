# Palimpsest alerting rules. Load via prometheus.yml rule_files.
groups:
  - name: palimpsest
    rules:
      - alert: NodeDown
        expr: up{job="palimpsest"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Palimpsest node {{ $labels.instance }} is unreachable"

      - alert: ChainStalled
        # head height has not advanced at all in 15 minutes
        expr: increase(palimpsest_height[15m]) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Chain has not advanced on {{ $labels.instance }} for 15m"

      - alert: DeltaPoolNearCap
        # MAX_DELTA_POOL is 512; warn well before eviction thrash
        expr: palimpsest_delta_pool > 480
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Delta mempool near cap on {{ $labels.instance }}"

      - alert: PendingBlocksHigh
        # MAX_PENDING is 256; sustained high pending means sync is not keeping up
        expr: palimpsest_pending_blocks > 200
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Many orphan/pending blocks on {{ $labels.instance }} — sync lagging"

      - alert: ProducerHasNoModel
        # a producing node with no training bridge attached contributes nothing
        expr: palimpsest_producer == 1 and palimpsest_model_attached == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Producer {{ $labels.instance }} has no training bridge attached"

      - alert: NoPeers
        expr: palimpsest_peers == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} has no connected peers (isolated)"
