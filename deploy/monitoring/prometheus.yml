# Prometheus scrape config for Palimpsest nodes.
# Each node exposes /metrics (Prometheus text format) on its API port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: palimpsest
    metrics_path: /metrics
    static_configs:
      # add each node's api host:port here (seed + miners)
      - targets:
          - "127.0.0.1:8090"
        labels: { role: node }
