# Palimpsest seed node — the network's first always-on bootstrap peer.
#
# Runs as a full OBSERVER (client/watch.py): follows the chain, serves IBD to
# joining peers, exposes the watch UI, and is a stable dial target for every
# other node. v1 is reachable on the cluster's private network (NodePorts
# below); PUBLIC exposure lands with the libp2p/NAT-traversal phase.
#
#   kubectl apply -f deploy/seed-node.yaml
#   gossip:  <node-ip>:30980      watch UI:  http://<node-ip>:30981
#
# The pod clones the private repo with a read-only deploy key (secret
# `seed-deploy-key`), installs CPU torch, and runs the observer. Model/data
# parameters MUST match the live chain's genesis parameters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seed-node
  namespace: palimpsest
  labels: {app: palimpsest-seed}
spec:
  replicas: 1
  selector:
    matchLabels: {app: palimpsest-seed}
  template:
    metadata:
      labels: {app: palimpsest-seed}
    spec:
      containers:
        - name: seed
          image: python:3.12-bookworm
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              mkdir -p ~/.ssh && cp /keys/id_ed25519 ~/.ssh/ && chmod 600 ~/.ssh/id_ed25519
              ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
              git clone --depth 1 git@github.com:connors2015/palimpsest.git /app
              cd /app
              pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
              pip install --no-cache-dir numpy pynacl
              mkdir -p data
              curl -sL -r 0-20000000 -o data/stories_val.txt \
                "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStories-valid.txt"
              exec python -m client.watch --id 8 --port 9800 --http 8080 \
                --peers "" --n 2 --seconds 1000000000 \
                --model small --data data/stories_val.txt --serve-device cpu \
                --data-contributor 3432d48fd6878b4f2e7a1e40cc15e112c512fae7
          ports:
            - {containerPort: 9800, name: gossip}
            - {containerPort: 8080, name: watch}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "3", memory: 6Gi}
          volumeMounts:
            - {name: deploy-key, mountPath: /keys, readOnly: true}
          readinessProbe:
            httpGet: {path: /status, port: 8080}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 40
      volumes:
        - name: deploy-key
          secret: {secretName: seed-deploy-key, defaultMode: 0400}
---
apiVersion: v1
kind: Service
metadata:
  name: seed-node
  namespace: palimpsest
spec:
  type: NodePort
  selector: {app: palimpsest-seed}
  ports:
    - {name: gossip, port: 9800, targetPort: 9800, nodePort: 30980}
    - {name: watch, port: 8080, targetPort: 8080, nodePort: 30981}
