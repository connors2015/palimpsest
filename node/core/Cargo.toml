[package]
name = "palimpsest-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic consensus math for the Palimpsest node — must match the Python reference bit-exactly (see node/vectors/golden.json)"

[dependencies]
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
